server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for container orchestrators
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Runtime configuration file: NEVER CACHE
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri =404;
    }

    # HTML entrypoint: NEVER CACHE
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri =404;
    }

    # Static assets (Vite hashed bundles): Long-term immutable caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse proxy for /api: Fallback when BACKEND_URL is not configured at startup
    location /api {
        default_type application/json;
        return 503 '{"error":{"code":"BACKEND_UNAVAILABLE","message":"BACKEND_URL is not configured"}}';
    }

    # Reverse proxy for /ws: Fallback when BACKEND_URL is not configured at startup
    location /ws {
        default_type text/plain;
        return 503 "BACKEND_URL is not configured\n";
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
